<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent IA — Démo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Agent IA — Démo</h1>
  <p class="subtitle">Epic 6 — conversation, file de validation (gating) et journal d'audit, en une seule page.</p>
</header>

<main>
  <section id="chat" class="panel">
    <h2>Discuter avec l'agent</h2>
    <p class="hint">Conversation : <code id="conversation-id">nouvelle</code></p>
    <div id="messages" class="messages"></div>
    <form id="chat-form">
      <textarea id="message-input" rows="2" placeholder="Pose ta question…" required></textarea>
      <button type="submit" id="send-btn">Envoyer</button>
    </form>
  </section>

  <aside class="sidebar">
    <section id="gating" class="panel">
      <div class="panel-header">
        <h2>File de validation (gating)</h2>
        <button type="button" class="refresh" data-refresh="gating">Actualiser</button>
      </div>
      <table>
        <thead>
          <tr><th>#</th><th>Action</th><th>Paramètres</th><th></th></tr>
        </thead>
        <tbody id="gating-body">
          <tr><td colspan="4" class="empty">Chargement…</td></tr>
        </tbody>
      </table>
    </section>

    <section id="audit" class="panel">
      <div class="panel-header">
        <h2>Journal d'audit</h2>
        <div class="panel-controls">
          <select id="audit-filter">
            <option value="">Tous les événements</option>
            <option value="agent.llm_call">agent.llm_call</option>
            <option value="agent.action_proposed">agent.action_proposed</option>
            <option value="gating.decision">gating.decision</option>
          </select>
          <button type="button" class="refresh" data-refresh="audit">Actualiser</button>
        </div>
      </div>
      <table>
        <thead>
          <tr><th>Horodatage</th><th>Événement</th><th>Source</th><th>Détail</th></tr>
        </thead>
        <tbody id="audit-body">
          <tr><td colspan="4" class="empty">Chargement…</td></tr>
        </tbody>
      </table>
    </section>
  </aside>
</main>

<script src="app.js"></script>
</body>
</html>
